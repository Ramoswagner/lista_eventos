<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary:#0A2B4E; --blue:#0088CC; --success:#10B981; --danger:#EF4444; }
    html, body { overflow-x:hidden; max-width:100%; }
    body { background:linear-gradient(135deg,#0A2B4E 0%,#0088CC 100%); min-height:100vh; font-family:'Inter',system-ui,sans-serif; padding:24px 16px; display:flex; align-items:center; justify-content:center; }
    .card-main { background:#fff; border-radius:20px; box-shadow:0 25px 60px rgba(0,0,0,.3); max-width:440px; width:100%; overflow:hidden; }
    .card-header-custom { background:var(--primary); color:#fff; padding:22px 30px; text-align:center; }
    .card-header-custom img { max-width:100%; height:60px; display:block; margin:0 auto; }
    .card-header-custom .subtitulo { font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; color:rgba(255,255,255,.6); font-weight:700; margin-top:4px; }
    .card-body-custom { padding:30px; text-align:center; }
    .evt-nome { font-weight:800; color:var(--primary); font-size:1.15rem; margin-bottom:2px; }
    .evt-meta { color:#64748B; font-size:.85rem; margin-bottom:22px; }
    .btn-confirmar { background:var(--success); color:#fff; border:none; border-radius:12px; padding:13px; font-weight:700; width:100%; margin-bottom:10px; transition:.2s; }
    .btn-confirmar:hover { filter:brightness(0.93); transform:translateY(-1px); }
    .btn-recusar { background:#fff; color:var(--danger); border:1.5px solid #FCA5A5; border-radius:12px; padding:12px; font-weight:700; width:100%; }
    .btn-recusar:hover { background:#FEF2F2; }
    .status-badge { display:inline-flex; align-items:center; gap:8px; padding:8px 18px; border-radius:50px; font-weight:700; font-size:.9rem; margin-bottom:6px; }
    .status-ok { background:#EAFBF3; color:var(--success); }
    .status-warn { background:#FFF6E9; color:#B4790A; }
    .qr-box { background:#F8FAFC; border-radius:16px; padding:16px; margin:18px auto 6px; display:inline-block; }
    .qr-box img, .qr-box canvas { display:block; margin:0 auto; }
    .qr-legenda { font-size:.78rem; color:#64748B; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="card-main" id="cardMain">
  <div class="card-header-custom"><img id="logoInstituicao" src="https://hospitaldabaleia.org.br/wp-content/uploads/2023/08/Ativo-3@2x.png" alt="Hospital da Baleia"><div class="subtitulo">Gestão de Eventos</div></div>
  <div class="card-body-custom" id="corpo">
    <i class="fas fa-spinner fa-spin fa-2x text-primary my-4"></i>
  </div>
</div>

<script>
  // Token validado no servidor (doGet): só letras, números e hífen — ou vazio.
  var TOKEN = <?!= JSON.stringify(qrToken) ?>;

  function esc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  if (!TOKEN) {
    renderErro('Link inválido. Confira se copiou o link inteiro.');
  } else {
    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(function(err) { renderErro('Não foi possível carregar o convite. Tente de novo em instantes.'); })
      .apiInfoConvitePublico(TOKEN);
  }

  google.script.run.withSuccessHandler(function(resp) {
    if (!resp || !resp.ok) return;
    var img = document.getElementById('logoInstituicao');
    img.src = resp.dados.url;
    img.style.height = Math.round(60 * (resp.dados.escala || 1)) + 'px';
  }).apiLogoPublico();

  // QR Code da entrada: contém só o token do convite. A recepção lê na
  // aba Check-in do sistema.
  function blocoQR() {
    return '<div class="qr-box"><div id="qrCode"></div></div>' +
      '<div class="qr-legenda mb-3"><i class="fas fa-qrcode"></i> Apresente este QR Code na entrada (pode ser pela tela do celular).</div>';
  }
  function desenharQR() {
    var el = document.getElementById('qrCode');
    if (!el) return;
    if (window.QRCode) {
      new QRCode(el, { text: TOKEN, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
    } else {
      el.innerHTML = '<p class="small text-muted mb-0">Não foi possível gerar o QR Code. Na entrada, informe seu nome.</p>';
    }
  }

  function render(resp) {
    if (!resp.ok) { renderErro(resp.mensagem); return; }
    var d = resp.dados;
    var corpo = document.getElementById('corpo');
    var meta = esc(d.dataEvento || 'data a definir') + (d.local ? ' · ' + esc(d.local) : '');

    if (d.status === 'Presente') {
      corpo.innerHTML =
        '<div class="status-badge status-ok"><i class="fas fa-circle-check"></i> Entrada registrada</div>' +
        '<div class="evt-nome mt-2">' + esc(d.evento) + '</div>' +
        '<div class="evt-meta">' + meta + '</div>' +
        '<p class="text-muted small mb-0">Olá, ' + esc(d.nome) + '. Seja bem-vindo(a)!</p>';
      return;
    }

    if (d.status === 'Confirmado') {
      corpo.innerHTML =
        '<div class="status-badge status-ok"><i class="fas fa-circle-check"></i> Presença confirmada</div>' +
        '<div class="evt-nome mt-2">' + esc(d.evento) + '</div>' +
        '<div class="evt-meta mb-0">' + meta + '</div>' +
        blocoQR() +
        '<p class="text-muted small mb-2">Olá, ' + esc(d.nome) + '. Te esperamos lá!</p>' +
        '<button class="btn-recusar mt-2" onclick="responder(\'Recusado\')"><i class="fas fa-xmark"></i> Não vou mais poder ir</button>';
      desenharQR();
      return;
    }

    if (d.status === 'Recusado') {
      corpo.innerHTML =
        '<div class="status-badge status-warn"><i class="fas fa-circle-info"></i> Você avisou que não vai</div>' +
        '<div class="evt-nome mt-2">' + esc(d.evento) + '</div>' +
        '<div class="evt-meta">' + meta + '</div>' +
        '<p class="text-muted small mb-0">Olá, ' + esc(d.nome) + '. Mudou de ideia?</p>' +
        '<button class="btn-confirmar mt-3" onclick="responder(\'Confirmado\')"><i class="fas fa-check"></i> Confirmar presença</button>';
      return;
    }

    corpo.innerHTML =
      '<p class="text-muted small mb-1">Você foi convidado(a) para</p>' +
      '<div class="evt-nome">' + esc(d.evento) + '</div>' +
      '<div class="evt-meta">' + meta + '</div>' +
      '<p class="mb-4">Olá, <strong>' + esc(d.nome) + '</strong>' + (d.empresa ? ' (' + esc(d.empresa) + ')' : '') + '. Você vai?</p>' +
      '<button class="btn-confirmar" onclick="responder(\'Confirmado\')"><i class="fas fa-check"></i> Sim, vou comparecer</button>' +
      '<button class="btn-recusar" onclick="responder(\'Recusado\')"><i class="fas fa-xmark"></i> Não vou poder ir</button>';
  }

  function recarregar() {
    google.script.run.withSuccessHandler(render)
      .withFailureHandler(function() { renderErro('Resposta registrada, mas não foi possível atualizar a página. Recarregue.'); })
      .apiInfoConvitePublico(TOKEN);
  }

  function responder(resposta) {
    document.getElementById('corpo').innerHTML = '<i class="fas fa-spinner fa-spin fa-2x text-primary my-4"></i>';
    google.script.run
      .withSuccessHandler(function(resp) {
        if (!resp.ok) { renderErro(resp.mensagem); return; }
        recarregar();   // mostra o novo estado (com QR Code se confirmou)
      })
      .withFailureHandler(function(err) { renderErro('Não foi possível registrar agora. Tente de novo em instantes.'); })
      .apiResponderConvitePublico(TOKEN, resposta);
  }

  function renderErro(msg) {
    document.getElementById('corpo').innerHTML =
      '<i class="fas fa-triangle-exclamation fa-2x text-danger mb-3"></i><p class="text-muted mb-0">' + esc(msg) + '</p>';
  }
</script>
</body>
</html>
